<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="David Zhang's Writing and Essays">
    <title>David Zhang - Writing</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg: #0a0a0c; --bg2: #101014; --bg3: #161619;
        --accent: #39d353; --accent-dim: rgba(57,211,83,0.15);
        --text: #e8ece9; --text-dim: #6a7d70; --text-muted: #444a46;
        --border: #1e2120;
      }
      body {
        background: var(--bg); color: var(--text);
        font-family: 'Inter', -apple-system, sans-serif;
        max-width: 780px; margin: 0 auto; padding: 0 24px;
        min-height: 100vh;
      }

      /* Nav */
      .site-nav {
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
        margin-bottom: 40px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .site-nav .site-title {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--text);
        text-decoration: none;
        margin-right: auto;
      }
      .site-nav .site-title:hover { color: var(--accent); }
      .site-nav a {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem; font-weight: 500;
        letter-spacing: 0.06em; text-transform: uppercase;
        text-decoration: none; color: var(--text-dim);
        padding: 6px 12px; border: 1px solid var(--border);
        border-radius: 4px; transition: all 0.25s ease;
      }
      .site-nav a:hover { color: var(--accent); border-color: var(--accent-dim); }
      .site-nav a.active { color: var(--accent); border-color: rgba(57,211,83,0.3); background: rgba(57,211,83,0.04); }

      /* Page header */
      .page-title {
        font-family: 'Syne', sans-serif;
        font-weight: 800; font-size: 1.8rem;
        color: var(--text); margin-bottom: 24px;
        letter-spacing: -0.02em;
      }

      /* Filter */
      .tag-filter {
        margin-bottom: 28px;
        display: flex; align-items: center; gap: 12px;
      }
      .tag-filter span {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.78rem; color: var(--text-dim);
      }
      #tagSelector {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.78rem;
        background: var(--bg2); color: var(--text);
        border: 1px solid var(--border); border-radius: 4px;
        padding: 6px 12px; outline: none;
        cursor: pointer;
      }
      #tagSelector:focus { border-color: var(--accent-dim); }

      /* Essay list */
      .essays .essay {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 18px 20px;
        margin-bottom: 12px;
        transition: border-color 0.25s ease, transform 0.2s ease;
      }
      .essays .essay:hover {
        border-color: rgba(57,211,83,0.3);
        transform: translateY(-1px);
      }
      .essays .essay h2 {
        font-family: 'Inter', sans-serif;
        font-weight: 600; font-size: 1rem;
        margin-bottom: 6px; line-height: 1.4;
        border: none; padding: 0;
      }
      .essays .essay h2 a {
        color: var(--accent); text-decoration: none;
        transition: color 0.2s ease;
      }
      .essays .essay h2 a:hover { color: #a0f0c8; }
      .essays .essay .date {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.72rem; color: var(--text-muted);
        margin-bottom: 8px;
      }
      .tags { margin-top: 8px; }
      .tag {
        display: inline-block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.68rem; color: var(--accent);
        background: var(--accent-dim);
        padding: 2px 8px; border-radius: 3px;
        margin-right: 4px; cursor: pointer;
        text-transform: lowercase;
        transition: background 0.2s ease;
      }
      .tag:hover { background: rgba(57,211,83,0.25); }

      /* Footer */
      .site-footer {
        text-align: center; padding: 40px 0;
        border-top: 1px solid var(--border); margin-top: 40px;
      }
      .site-footer p {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.72rem; color: var(--text-muted);
      }
    </style>
</head>
<body>
    <nav class="site-nav">
      <a href="home.html" class="site-title">David Zhang</a>
      <a href="home.html">Home</a>
      <a href="home.html#podcast-section">Podcast</a>
      <a href="writing.html" class="active">Writing</a>
      <a href="math.html">Math</a>
    </nav>

    <h1 class="page-title">Writing</h1>

    <div class="main">
        <div class="tag-filter">
            <span>Filter by tag:</span>
            <select id="tagSelector">
                <option value="all">All Essays</option>
            </select>
        </div>
        <div class="essays"></div>
    </div>

    <footer class="site-footer"><p>&copy; 2025 David Zhang</p></footer>
    <script src="loadEssays.js"></script>
</body>
</html>
